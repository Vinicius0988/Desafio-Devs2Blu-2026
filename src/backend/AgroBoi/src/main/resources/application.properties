spring.application.name=agroboi
# Banco usado por padrão: mysql (Docker). Para MariaDB: SPRING_PROFILES_ACTIVE=mariadb
spring.profiles.default=mysql
# update: o Hibernate cria/ajusta as tabelas sozinho. Use DDL_AUTO=validate se preferir rodar banco/agroboi_mariadb.sql antes.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=root
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# --- Segurança (JWT) ---
# JWT_SECRET: mínimo de 32 caracteres. Sem ele, uma chave aleatória é gerada a cada start (logins caem ao reiniciar).
agroboi.jwt.secret=${JWT_SECRET:}
agroboi.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}
# Primeiro administrador (criado no start se ainda não existir). Defina as duas variáveis.
agroboi.admin.email=${ADMIN_EMAIL:}
agroboi.admin.senha=${ADMIN_PASSWORD:}
# Origens liberadas no CORS (separadas por vírgula). "*" libera qualquer origem; restrinja em produção.
agroboi.cors.origens=${CORS_ORIGENS:*}
