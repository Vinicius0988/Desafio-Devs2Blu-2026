spring.application.name=agroboi
# Sem perfis explicitos: MariaDB local em desenvolvimento.
spring.profiles.default=mariadb,dev
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Segredo estavel obrigatorio; minimo de 32 bytes UTF-8.
agroboi.jwt.secret=${JWT_SECRET:}
agroboi.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}
agroboi.admin.email=${ADMIN_EMAIL:}
agroboi.admin.senha=${ADMIN_PASSWORD:}
# Apenas origens explicitas, sem curingas.
agroboi.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500}
